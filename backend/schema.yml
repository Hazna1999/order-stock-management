  /api/v1/orders/:
    get:
      operationId: orders_list
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CONFIRMED
          - DELIVERED
          - DRAFT
          - SHIPPED
        description: |-
          * `DRAFT` - Draft
          * `CONFIRMED` - Confirmed
          * `SHIPPED` - Shipped
          * `DELIVERED` - Delivered
          * `CANCELLED` - Cancelled
